global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'kafka-webhook-sender'
    static_configs:
      - targets: ['kafka-webhook-sender:8080']
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    
  - job_name: 'test-webhook-server'
    static_configs:
      - targets: ['test-webhook:8080']
    metrics_path: '/stats'
    scrape_interval: 15s