apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-webhook
  namespace: kafka-webhook-sender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-webhook
  template:
    metadata:
      labels:
        app: test-webhook
    spec:
      containers:
      - name: test-webhook
        image: test-webhook:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: test-webhook-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: test-webhook
  namespace: kafka-webhook-sender
  labels:
    app: test-webhook
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: test-webhook
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: test-webhook-external
  namespace: kafka-webhook-sender
  labels:
    app: test-webhook
spec:
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30089
    name: http
  selector:
    app: test-webhook
  type: NodePort