apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webhook-sender-data
  namespace: kafka-webhook-sender
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-webhook-sender
  namespace: kafka-webhook-sender
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-webhook-sender
  template:
    metadata:
      labels:
        app: kafka-webhook-sender
    spec:
      containers:
      - name: kafka-webhook-sender
        image: kafka-webhook-sender:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: ROCKSDB_PATH
          value: "/app/data/rocksdb"
        - name: SPRING_CONFIG_LOCATION
          value: "classpath:/application.yml,/config/application.yml"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: webhook-sender-data
      - name: config
        configMap:
          name: kafka-webhook-sender-config

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-webhook-sender
  namespace: kafka-webhook-sender
  labels:
    app: kafka-webhook-sender
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: kafka-webhook-sender
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-webhook-sender-external
  namespace: kafka-webhook-sender
  labels:
    app: kafka-webhook-sender
spec:
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
    name: http
  selector:
    app: kafka-webhook-sender
  type: NodePort