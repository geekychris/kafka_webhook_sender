apiVersion: v1
kind: Namespace
metadata:
  name: kafka-webhook-sender
  labels:
    app: kafka-webhook-sender

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-webhook-sender-config
  namespace: kafka-webhook-sender
data:
  application.yml: |
    server:
      port: 8080
    
    spring:
      application:
        name: kafka-webhook-sender
      kafka:
        bootstrap-servers: kafka:9092
        consumer:
          group-id: webhook-sender-group
          auto-offset-reset: earliest
          enable-auto-commit: false
    
    rocksdb:
      path: /app/data/rocksdb
    
    event:
      delivery:
        scheduler:
          delay: 5000
    
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
      metrics:
        export:
          prometheus:
            enabled: true
    
    logging:
      level:
        com.example.kafkawebhooksender: INFO

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-webhook-config
  namespace: kafka-webhook-sender
data:
  SERVER_PORT: "8080"